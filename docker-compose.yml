# docker compose up                       -> works with AI_PROVIDER=offline and nothing else
# docker compose --profile local-ai up    -> also starts Ollama for AI_PROVIDER=local
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-offline}
    volumes:
      - ./data:/app/data:ro          # edit course/faq/jobs JSON without rebuilding; restart to reload
      - wwm-db:/app/var              # SQLite file
    restart: unless-stopped

  speech-edge:
    image: nginx:1.27-alpine
    profiles: ["speech-edge"]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest   # pin a version you have tested
    profiles: ["local-ai"]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  speech-rate-limit:
    image: redis:7-alpine
    profiles: ["speech"]
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - speech-rate-limit:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  wwm-db:
  ollama:
  speech-rate-limit:
